<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
.th{font-size:14px;font-weight:600;fill:#1f2933}
.ts{font-size:12px;fill:#3e4c59}
.arr{stroke:#7b8794;fill:none;stroke-width:1.2}
.box{fill:#f5f7fa;stroke:#cbd2d9}
.gray rect,.gray ellipse,.gray circle{fill:#f0efec;stroke:#b6b2a8}
.teal rect,.teal ellipse{fill:#e3f2ee;stroke:#8fc7b8}
.purple rect,.purple ellipse{fill:#efe9f6;stroke:#b9a6d4}
.coral rect,.coral ellipse{fill:#fbebe6;stroke:#e0a08c}
.gray text{fill:#3f3d38}.teal text{fill:#1f5c4d}.purple text{fill:#4a3768}.coral text{fill:#8f4229}
</style>
<rect width="680" height="500" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7b8794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="25" y="22" dominant-baseline="central">2. append_event</text>
<g class="gray"><rect x="25" y="46" width="115" height="38" rx="8" stroke-width="1"/><text class="ts" x="82.5" y="65.0" text-anchor="middle" dominant-baseline="central">Caller</text></g>
<g class="teal"><rect x="185" y="46" width="115" height="38" rx="8" stroke-width="1"/><text class="ts" x="242.5" y="65.0" text-anchor="middle" dominant-baseline="central">SessionService</text></g>
<g class="teal"><rect x="360" y="46" width="115" height="38" rx="8" stroke-width="1"/><text class="ts" x="417.5" y="65.0" text-anchor="middle" dominant-baseline="central">Events</text></g>
<g class="teal"><rect x="535" y="46" width="115" height="38" rx="8" stroke-width="1"/><text class="ts" x="592.5" y="65.0" text-anchor="middle" dominant-baseline="central">State</text></g>
<line x1="82" y1="84" x2="82" y2="470" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="242" y1="84" x2="242" y2="470" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="417" y1="84" x2="417" y2="470" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="592" y1="84" x2="592" y2="470" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<text class="ts" x="160.0" y="112" text-anchor="middle">append_event(session, event)</text>
<line x1="82" y1="126" x2="234" y2="126" class="arr" marker-end="url(#ar)"/>
<path d="M242 152 L282 152 L282 174 L246 174" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="292" y="163" dominant-baseline="central">acquire per-session lock</text>
<text class="ts" x="327.5" y="204" text-anchor="middle">append(event)</text>
<line x1="242" y1="218" x2="409" y2="218" class="arr" marker-end="url(#ar)"/>
<path d="M242 244 L282 244 L282 266 L246 266" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="292" y="255" dominant-baseline="central">read event.actions.state_delta</text>
<text class="ts" x="415.0" y="296" text-anchor="middle">merge state_delta — skip keys prefixed temp:</text>
<line x1="242" y1="310" x2="584" y2="310" class="arr" marker-end="url(#ar)"/>
<path d="M242 336 L282 336 L282 358 L246 358" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="292" y="347" dominant-baseline="central">persist (DB / Vertex backends only)</text>
<path d="M242 384 L282 384 L282 406 L246 406" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="292" y="395" dominant-baseline="central">release lock</text>
<text class="ts" x="164.0" y="436" text-anchor="middle">event</text>
<line x1="242" y1="450" x2="90" y2="450" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
</svg>
