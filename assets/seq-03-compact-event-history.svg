<svg xmlns="http://www.w3.org/2000/svg" width="680" height="545" viewBox="0 0 680 545" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
.th{font-size:14px;font-weight:600;fill:#1f2933}
.ts{font-size:12px;fill:#3e4c59}
.arr{stroke:#7b8794;fill:none;stroke-width:1.2}
.box{fill:#f5f7fa;stroke:#cbd2d9}
.gray rect,.gray ellipse,.gray circle{fill:#f0efec;stroke:#b6b2a8}
.teal rect,.teal ellipse{fill:#e3f2ee;stroke:#8fc7b8}
.purple rect,.purple ellipse{fill:#efe9f6;stroke:#b9a6d4}
.coral rect,.coral ellipse{fill:#fbebe6;stroke:#e0a08c}
.gray text{fill:#3f3d38}.teal text{fill:#1f5c4d}.purple text{fill:#4a3768}.coral text{fill:#8f4229}
</style>
<rect width="680" height="545" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7b8794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="25" y="22" dominant-baseline="central">3. compact event history</text>
<text class="ts" x="25" y="41" dominant-baseline="central">async — runs after the reply is sent, does not block the next turn</text>
<g class="gray"><rect x="25" y="60" width="120" height="38" rx="8" stroke-width="1"/><text class="ts" x="85.0" y="79.0" text-anchor="middle" dominant-baseline="central">Runner</text></g>
<g class="teal"><rect x="195" y="60" width="120" height="38" rx="8" stroke-width="1"/><text class="ts" x="255.0" y="79.0" text-anchor="middle" dominant-baseline="central">SessionService</text></g>
<g class="teal"><rect x="365" y="60" width="120" height="38" rx="8" stroke-width="1"/><text class="ts" x="425.0" y="79.0" text-anchor="middle" dominant-baseline="central">Events</text></g>
<g class="purple"><rect x="530" y="60" width="120" height="38" rx="8" stroke-width="1"/><text class="ts" x="590.0" y="79.0" text-anchor="middle" dominant-baseline="central">LLM</text></g>
<line x1="85" y1="98" x2="85" y2="505" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="255" y1="98" x2="255" y2="505" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="425" y1="98" x2="425" y2="505" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="590" y1="98" x2="590" y2="505" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<text class="ts" x="168.0" y="122" text-anchor="middle">turn finished — check compaction</text>
<line x1="85" y1="136" x2="247" y2="136" class="arr" marker-end="url(#ar)"/>
<path d="M255 160 L295 160 L295 182 L259 182" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="305" y="171" dominant-baseline="central">count events / tokens — local, no LLM</text>
<rect x="60" y="205" width="580" height="255" rx="8" fill="none" class="arr" stroke-dasharray="6 4" opacity="0.5"/>
<text class="ts" x="72" y="221" dominant-baseline="central">alt [threshold reached]</text>
<text class="ts" x="338.0" y="248" text-anchor="middle">read window [start..end]</text>
<line x1="255" y1="262" x2="417" y2="262" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="342.0" y="292" text-anchor="middle">raw events</text>
<line x1="425" y1="306" x2="263" y2="306" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="ts" x="420.5" y="336" text-anchor="middle">summarize this window</text>
<line x1="255" y1="350" x2="582" y2="350" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="424.5" y="380" text-anchor="middle">summary text</text>
<line x1="590" y1="394" x2="263" y2="394" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="ts" x="338.0" y="424" text-anchor="middle">append compaction event (tagged, covers range)</text>
<line x1="255" y1="438" x2="417" y2="438" class="arr" marker-end="url(#ar)"/>
<rect x="60" y="478" width="580" height="34" rx="6" class="box" stroke-width="1"/>
<text class="ts" x="76" y="494" dominant-baseline="central">Raw events are never deleted. get_contents() swaps the window for the summary only when building the prompt.</text>
</svg>
