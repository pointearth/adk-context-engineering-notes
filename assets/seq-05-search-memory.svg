<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
.th{font-size:14px;font-weight:600;fill:#1f2933}
.ts{font-size:12px;fill:#3e4c59}
.arr{stroke:#7b8794;fill:none;stroke-width:1.2}
.box{fill:#f5f7fa;stroke:#cbd2d9}
.gray rect,.gray ellipse,.gray circle{fill:#f0efec;stroke:#b6b2a8}
.teal rect,.teal ellipse{fill:#e3f2ee;stroke:#8fc7b8}
.purple rect,.purple ellipse{fill:#efe9f6;stroke:#b9a6d4}
.coral rect,.coral ellipse{fill:#fbebe6;stroke:#e0a08c}
.gray text{fill:#3f3d38}.teal text{fill:#1f5c4d}.purple text{fill:#4a3768}.coral text{fill:#8f4229}
</style>
<rect width="680" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7b8794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="25" y="22" dominant-baseline="central">5. search_memory</text>
<g class="gray"><rect x="30" y="45" width="130" height="38" rx="8" stroke-width="1"/><text class="ts" x="95.0" y="64.0" text-anchor="middle" dominant-baseline="central">Caller</text></g>
<g class="purple"><rect x="255" y="45" width="130" height="38" rx="8" stroke-width="1"/><text class="ts" x="320.0" y="64.0" text-anchor="middle" dominant-baseline="central">MemoryService</text></g>
<g class="purple"><rect x="480" y="45" width="130" height="38" rx="8" stroke-width="1"/><text class="ts" x="545.0" y="64.0" text-anchor="middle" dominant-baseline="central">MemoryStore</text></g>
<line x1="95" y1="83" x2="95" y2="360" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="320" y1="83" x2="320" y2="360" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="545" y1="83" x2="545" y2="360" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<text class="ts" x="205.5" y="112" text-anchor="middle">search_memory(app_name, user_id, query)</text>
<line x1="95" y1="126" x2="312" y2="126" class="arr" marker-end="url(#ar)"/>
<path d="M320 152 L360 152 L360 174 L324 174" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="370" y="163" dominant-baseline="central">scope = app_name + user_id</text>
<text class="ts" x="430.5" y="204" text-anchor="middle">keyword match or vector top-k</text>
<line x1="320" y1="218" x2="537" y2="218" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="434.5" y="248" text-anchor="middle">matching entries</text>
<line x1="545" y1="262" x2="328" y2="262" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="ts" x="209.5" y="292" text-anchor="middle">SearchMemoryResponse</text>
<line x1="320" y1="306" x2="103" y2="306" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="30" y="326" width="580" height="30" rx="6" class="box" stroke-width="1"/>
<text class="ts" x="46" y="342" dominant-baseline="central">Vector backends return the k nearest entries regardless of relevance — a small store always yields noise.</text>
</svg>
