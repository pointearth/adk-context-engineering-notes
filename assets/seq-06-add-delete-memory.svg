<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
.th{font-size:14px;font-weight:600;fill:#1f2933}
.ts{font-size:12px;fill:#3e4c59}
.arr{stroke:#7b8794;fill:none;stroke-width:1.2}
.box{fill:#f5f7fa;stroke:#cbd2d9}
.gray rect,.gray ellipse,.gray circle{fill:#f0efec;stroke:#b6b2a8}
.teal rect,.teal ellipse{fill:#e3f2ee;stroke:#8fc7b8}
.purple rect,.purple ellipse{fill:#efe9f6;stroke:#b9a6d4}
.coral rect,.coral ellipse{fill:#fbebe6;stroke:#e0a08c}
.gray text{fill:#3f3d38}.teal text{fill:#1f5c4d}.purple text{fill:#4a3768}.coral text{fill:#8f4229}
</style>
<rect width="680" height="470" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7b8794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="25" y="22" dominant-baseline="central">6. add_memory / delete memory</text>
<g class="gray"><rect x="30" y="45" width="130" height="38" rx="8" stroke-width="1"/><text class="ts" x="95.0" y="64.0" text-anchor="middle" dominant-baseline="central">App code</text></g>
<g class="purple"><rect x="255" y="45" width="130" height="38" rx="8" stroke-width="1"/><text class="ts" x="320.0" y="64.0" text-anchor="middle" dominant-baseline="central">MemoryService</text></g>
<g class="purple"><rect x="480" y="45" width="130" height="38" rx="8" stroke-width="1"/><text class="ts" x="545.0" y="64.0" text-anchor="middle" dominant-baseline="central">MemoryStore</text></g>
<line x1="95" y1="83" x2="95" y2="430" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="320" y1="83" x2="320" y2="430" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="545" y1="83" x2="545" y2="430" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<rect x="40" y="98" width="600" height="200" rx="8" fill="none" class="arr" stroke-dasharray="6 4" opacity="0.5"/>
<text class="ts" x="52" y="114" dominant-baseline="central">add_memory — exact text, no LLM extraction</text>
<text class="ts" x="205.5" y="138" text-anchor="middle">add_memory(app, user_id, MemoryEntry)</text>
<line x1="95" y1="152" x2="312" y2="152" class="arr" marker-end="url(#ar)"/>
<rect x="55" y="170" width="570" height="80" rx="6" fill="none" class="arr" stroke-dasharray="5 4" opacity="0.4"/>
<text class="ts" x="66" y="185" dominant-baseline="central">opt [enable_consolidation = true — off by default]</text>
<text class="ts" x="430.5" y="204" text-anchor="middle">read existing entries in scope, merge or replace</text>
<line x1="320" y1="218" x2="537" y2="218" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="430.5" y="262" text-anchor="middle">write entry verbatim</text>
<line x1="320" y1="276" x2="537" y2="276" class="arr" marker-end="url(#ar)"/>
<rect x="40" y="312" width="600" height="100" rx="8" fill="none" class="arr" stroke-dasharray="6 4" opacity="0.5"/>
<text class="ts" x="52" y="328" dominant-baseline="central">delete memory</text>
<text class="ts" x="205.5" y="352" text-anchor="middle">delete(app, user_id, entry_id)</text>
<line x1="95" y1="366" x2="312" y2="366" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="430.5" y="382" text-anchor="middle">remove from store</text>
<line x1="320" y1="396" x2="537" y2="396" class="arr" marker-end="url(#ar)"/>
<rect x="30" y="428" width="610" height="30" rx="6" class="box" stroke-width="1"/>
<text class="ts" x="46" y="444" dominant-baseline="central">No LLM involved on either path. Use add_memory when a fact must not be dropped or reworded.</text>
</svg>
