<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
.th{font-size:14px;font-weight:600;fill:#1f2933}
.ts{font-size:12px;fill:#3e4c59}
.arr{stroke:#7b8794;fill:none;stroke-width:1.2}
.box{fill:#f5f7fa;stroke:#cbd2d9}
.gray rect,.gray ellipse,.gray circle{fill:#f0efec;stroke:#b6b2a8}
.teal rect,.teal ellipse{fill:#e3f2ee;stroke:#8fc7b8}
.purple rect,.purple ellipse{fill:#efe9f6;stroke:#b9a6d4}
.coral rect,.coral ellipse{fill:#fbebe6;stroke:#e0a08c}
.gray text{fill:#3f3d38}.teal text{fill:#1f5c4d}.purple text{fill:#4a3768}.coral text{fill:#8f4229}
</style>
<rect width="680" height="520" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7b8794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="25" y="22" dominant-baseline="central">7. PreloadMemoryTool</text>
<text class="ts" x="25" y="41" dominant-baseline="central">runs inside GenerateContext, before the model is called — every turn, unconditionally</text>
<g class="gray"><rect x="25" y="58" width="118" height="38" rx="8" stroke-width="1"/><text class="ts" x="84.0" y="70.0" text-anchor="middle" dominant-baseline="central">create System</text><text class="ts" x="84.0" y="84.0" text-anchor="middle" dominant-baseline="central">instruction</text></g>
<g class="coral"><rect x="188" y="58" width="118" height="38" rx="8" stroke-width="1"/><text class="ts" x="247.0" y="70.0" text-anchor="middle" dominant-baseline="central">Preload</text><text class="ts" x="247.0" y="84.0" text-anchor="middle" dominant-baseline="central">MemoryTool</text></g>
<g class="teal"><rect x="351" y="58" width="118" height="38" rx="8" stroke-width="1"/><text class="ts" x="410.0" y="77.0" text-anchor="middle" dominant-baseline="central">Session</text></g>
<g class="purple"><rect x="514" y="58" width="118" height="38" rx="8" stroke-width="1"/><text class="ts" x="573.0" y="77.0" text-anchor="middle" dominant-baseline="central">MemoryService</text></g>
<line x1="84" y1="96" x2="84" y2="480" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="247" y1="96" x2="247" y2="480" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="410" y1="96" x2="410" y2="480" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="573" y1="96" x2="573" y2="480" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<text class="ts" x="163.5" y="120" text-anchor="middle">process_llm_request()</text>
<line x1="84" y1="134" x2="239" y2="134" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="326.5" y="164" text-anchor="middle">read latest user message</text>
<line x1="247" y1="178" x2="402" y2="178" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="330.5" y="208" text-anchor="middle">message text</text>
<line x1="410" y1="222" x2="255" y2="222" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<path d="M247 248 L287 248 L287 270 L251 270" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="297" y="259" dominant-baseline="central">query = that message, verbatim</text>
<text class="ts" x="408.0" y="300" text-anchor="middle">search_memory(app, user_id, query)</text>
<line x1="247" y1="314" x2="565" y2="314" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="412.0" y="344" text-anchor="middle">matching entries</text>
<line x1="573" y1="358" x2="255" y2="358" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="ts" x="167.5" y="388" text-anchor="middle">append formatted text to system instruction</text>
<line x1="247" y1="402" x2="92" y2="402" class="arr" marker-end="url(#ar)"/>
<rect x="25" y="424" width="607" height="48" rx="6" class="box" stroke-width="1"/>
<text class="ts" x="41" y="440" dominant-baseline="central">Nothing is written to Events or State. The injected text lives only in this one request and is</text>
<text class="ts" x="41" y="456" dominant-baseline="central">rebuilt from a fresh search next turn. Cost: one retrieval per turn, whether or not it is useful.</text>
</svg>
