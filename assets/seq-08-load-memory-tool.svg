<line x1="81" y1="442" x2="624" y2="442" class="arr" marker-end="url(#ar)"/>
<line x1="25" y1="478" x2="655" y2="478" class="arr" stroke-width="1.5"/>
<text class="ts" x="25" y="502" dominant-baseline="central">Scope ends here. The runner then rebuilds context — see get_contents — and calls the model again.</text>
