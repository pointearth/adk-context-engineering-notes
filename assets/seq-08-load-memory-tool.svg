<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
.th{font-size:14px;font-weight:600;fill:#1f2933}
.ts{font-size:12px;fill:#3e4c59}
.arr{stroke:#7b8794;fill:none;stroke-width:1.2}
