<g class="purple"><rect x="180" y="58" width="112" height="38" rx="8" stroke-width="1"/><text class="ts" x="236.0" y="77.0" text-anchor="middle" dominant-baseline="central">LLM</text></g>
<g class="coral"><rect x="335" y="58" width="112" height="38" rx="8" stroke-width="1"/><text class="ts" x="391.0" y="70.0" text-anchor="middle" dominant-baseline="central">Load</text><text class="ts" x="391.0" y="84.0" text-anchor="middle" dominant-baseline="central">MemoryTool</text></g>
<g class="purple"><rect x="490" y="58" width="112" height="38" rx="8" stroke-width="1"/><text class="ts" x="546.0" y="77.0" text-anchor="middle" dominant-baseline="central">MemoryService</text></g>
<g class="teal"><rect x="610" y="58" width="45" height="38" rx="8" stroke-width="1"/><text class="ts" x="632.5" y="70.0" text-anchor="middle" dominant-baseline="central">Ev-</text><text class="ts" x="632.5" y="84.0" text-anchor="middle" dominant-baseline="central">ents</text></g>
<line x1="81" y1="96" x2="81" y2="470" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="236" y1="96" x2="236" y2="470" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="391" y1="96" x2="391" y2="470" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="546" y1="96" x2="546" y2="470" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="632" y1="96" x2="632" y2="470" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<text class="ts" x="156.5" y="120" text-anchor="middle">model call (context already built)</text>
<line x1="81" y1="134" x2="228" y2="134" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="160.5" y="164" text-anchor="middle">function_call: load_memory(query)</text>
