<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<style>
.th{font-size:14px;font-weight:600;fill:#1f2933}
.ts{font-size:12px;fill:#3e4c59}
.arr{stroke:#7b8794;fill:none;stroke-width:1.2}
.box{fill:#f5f7fa;stroke:#cbd2d9}
.gray rect,.gray ellipse,.gray circle{fill:#f0efec;stroke:#b6b2a8}
.teal rect,.teal ellipse{fill:#e3f2ee;stroke:#8fc7b8}
.purple rect,.purple ellipse{fill:#efe9f6;stroke:#b9a6d4}
.coral rect,.coral ellipse{fill:#fbebe6;stroke:#e0a08c}
.gray text{fill:#3f3d38}.teal text{fill:#1f5c4d}.purple text{fill:#4a3768}.coral text{fill:#8f4229}
</style>
<rect width="680" height="590" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7b8794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="25" y="22" dominant-baseline="central">9. GenerateContext</text>
<text class="ts" x="25" y="41" dominant-baseline="central">runs before every model call — nothing carries over from the previous one</text>
<g class="gray"><rect x="25" y="58" width="108" height="38" rx="8" stroke-width="1"/><text class="ts" x="79.0" y="77.0" text-anchor="middle" dominant-baseline="central">Runner</text></g>
<g class="gray"><rect x="171" y="58" width="108" height="38" rx="8" stroke-width="1"/><text class="ts" x="225.0" y="77.0" text-anchor="middle" dominant-baseline="central">Agent</text></g>
<g class="coral"><rect x="317" y="58" width="108" height="38" rx="8" stroke-width="1"/><text class="ts" x="371.0" y="70.0" text-anchor="middle" dominant-baseline="central">Preload</text><text class="ts" x="371.0" y="84.0" text-anchor="middle" dominant-baseline="central">MemoryTool</text></g>
<g class="teal"><rect x="463" y="58" width="94" height="38" rx="8" stroke-width="1"/><text class="ts" x="510.0" y="77.0" text-anchor="middle" dominant-baseline="central">State</text></g>
<g class="teal"><rect x="571" y="58" width="84" height="38" rx="8" stroke-width="1"/><text class="ts" x="613.0" y="77.0" text-anchor="middle" dominant-baseline="central">Events</text></g>
<line x1="79" y1="96" x2="79" y2="510" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="225" y1="96" x2="225" y2="510" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="371" y1="96" x2="371" y2="510" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="510" y1="96" x2="510" y2="510" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<line x1="613" y1="96" x2="613" y2="510" class="arr" stroke-dasharray="4 4" opacity="0.35"/>
<text class="ts" x="150.0" y="120" text-anchor="middle">build request</text>
<line x1="79" y1="134" x2="217" y2="134" class="arr" marker-end="url(#ar)"/>
<rect x="40" y="152" width="615" height="200" rx="8" fill="none" class="arr" stroke-dasharray="6 4" opacity="0.5"/>
<text class="ts" x="52" y="168" dominant-baseline="central">create System instruction</text>
<path d="M225 186 L265 186 L265 208 L229 208" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="275" y="197" dominant-baseline="central">1. load static config — already in memory, no I/O</text>
<text class="ts" x="365.5" y="230" text-anchor="middle">2. read values for {key} placeholders</text>
<line x1="225" y1="244" x2="502" y2="244" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="369.5" y="268" text-anchor="middle">values</text>
<line x1="510" y1="282" x2="233" y2="282" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="ts" x="298.0" y="306" text-anchor="middle">3. invoke — every turn</text>
<line x1="225" y1="320" x2="367" y2="320" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="300.0" y="330" text-anchor="middle">retrieved text appended</text>
<line x1="371" y1="344" x2="233" y2="344" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="40" y="366" width="615" height="106" rx="8" fill="none" class="arr" stroke-dasharray="6 4" opacity="0.5"/>
<text class="ts" x="52" y="382" dominant-baseline="central">get_contents</text>
<text class="ts" x="417.0" y="400" text-anchor="middle">read event history</text>
<line x1="225" y1="414" x2="605" y2="414" class="arr" marker-end="url(#ar)"/>
<text class="ts" x="421.0" y="438" text-anchor="middle">events, with compaction ranges marked</text>
<line x1="613" y1="452" x2="233" y2="452" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text class="ts" x="154.0" y="486" text-anchor="middle">LlmRequest</text>
<line x1="225" y1="500" x2="87" y2="500" class="arr" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<rect x="25" y="520" width="630" height="46" rx="6" class="box" stroke-width="1"/>
<text class="ts" x="41" y="536" dominant-baseline="central">Covered event ranges are replaced by their summary here, not in storage. Purely local —</text>
<text class="ts" x="41" y="552" dominant-baseline="central">the only outbound call in this whole diagram is PreloadMemoryTool's retrieval.</text>
</svg>
